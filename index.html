<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตามล่าใบ้พี่รหัส</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="hh-root">
  <h1 class="hh-title">ตามล่าคำใบ้พี่รหัส</h1>
  <p class="hh-sub">ไม่ต้องกังวล หน้าที่น้องเจออาจไม่เหมือนเพื่อน <br>เพราะพี่รหัสน้องเป็นคนพิเศษใส่ไข่ อิอิ</p>
 
  <div class="hh-card" style="text-align:center;">
    <p class="hh-eyebrow">ยินดีต้อนรับ</p>
    <p class="hh-q-title">มีคำถามทั้งหมด 5 ข้อ<br>ตอบถูกวันนี้ ปลดคำใบ้พรุ่งนี้ค่อยเล่นข้อต่อไปนะ</p>
    <a class="hh-btn" href="q1.html">เริ่มเล่นเลย</a>
    <!--<a class="hh-btn hh-btn-ghost" href="hints.html" style="margin-top:10px;">ดูคลังคำใบ้ที่สะสมได้</a>-->
  </div>
 
  <script src="app.js"></script>
  <script>
    // ส่งผู้เล่นไปยังคำถามล่าสุดที่กำลังเล่นค้างอยู่โดยอัตโนมัติ
    (function autoRedirect() {
      const state = hhLoadState();
      if (state && state.correctCount > 0) {
        if (state.correctCount >= QUESTIONS.length) {
          window.location.replace('hints.html');
        } else {
          window.location.replace(`q${state.correctCount + 1}.html`);
        }
      }
    })();
  </script>
</body>
</html>
